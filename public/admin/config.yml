# Sveltia CMS-konfigurasjon for RF-Regi (rfregi.no)
# JSON-skjema: https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
locale: nb

backend:
  # GitHub-backend: alle med skriverettigheter til repoet kan logge inn.
  # Nettstedet hostes på Netlify, og Sveltia bruker da Netlifys innebygde
  # OAuth-klient automatisk (default base_url https://api.netlify.com/auth) —
  # Netlify Identity må være aktivert på Netlify-siden
  name: github
  repo: RF-Regi/www
  # Gjør CMS-innlogging mulig også fra deploy previews og andre URL-er som
  # ikke er registrert hos OAuth-klienten (Netlify kjenner bare hoveddomenet).
  site_domain: rfregi.no
  # branch er valgfri; standard er repositoriets standardgren (main).
  # branch: main

  # ALTERNATIV (vert-uavhengig, bruk hvis Netlify Identity forsvinner eller
  # nettstedet flyttes, f.eks. til GitHub Pages): Sveltia CMS Authenticator —
  # https://github.com/sveltia/sveltia-cms-auth deployes til Cloudflare Workers,
  # registreres som GitHub App, og worker-URL-en settes som base_url:
  # base_url: https://<din-authenticator-worker>.workers.dev

# Medier lagres i public/media og refereres som /media/images/... på nettstedet.
media_folder: public/media
public_folder: /media

# Endringer går via redigeringsarbeidsflyt (draft → in review → ready → publish)
# i stedet for å committ'es rett til main.
publish_mode: editorial_workflow

collections:
  - name: sider
    label: Sider – teksten på sidene
    label_singular: Side
    folder: src/content/pages
    extension: md
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { label: Tittel, name: title, widget: string }
      - { label: Teaser, name: teaser, widget: string, required: false }
      - { label: Permalenke, name: permalink, widget: string, pattern: ['^\\/.+\\/$', 'Må starte og slutte med skråstrek, f.eks. /utleie/'] }
      - label: Skjema
        name: showForm
        widget: select
        options:
          - { label: Ingen skjema, value: none }
          - { label: Bli med-skjema (verving), value: join }
          - { label: Kontaktskjema, value: contact }
        default: none
        hint: 'Velg hvilket innsendingskjema som vises på siden'
      # Sveltia krever at brødteksten er deklarert som felt med navnet «body» —
      # den lagres da under frontmatter (ikke i den), og leses fra eksisterende filer.
      - { label: Innhold, name: body, widget: markdown, required: false }

  - name: referater
    label: Generalforsamling – nye referater
    label_singular: Referat
    folder: src/content/referater
    extension: md
    create: true
    slug: '{{slug}}'
    summary: '{{halvår}} {{år}} – {{tittel}}'
    sortable_fields: [år, tittel]
    fields:
      - { label: Tittel, name: tittel, widget: string, hint: 'F.eks. «Generalforsamling» eller «Oppstartsmøte»' }
      - { label: År, name: år, widget: number, value_type: int, min: 2000, max: 2100, default: 2026 }
      - label: Halvår
        name: halvår
        widget: select
        options:
          - { label: Vår, value: vår }
          - { label: Høst, value: høst }
        default: vår
      - { label: Ekstraordinær, name: ekstraordinær, widget: boolean, default: false }
      - label: PDF-fil
        name: fil
        widget: file
        hint: 'Last opp PDF-en i mappen «referater» i mediabiblioteket. Filnavnet bør starte med H (høst) eller V (vår) + år, f.eks. V26-generalforsamling.pdf'

  - name: styret
    label: Styret
    label_singular: Styremedlem
    folder: src/content/styret
    extension: md
    create: true
    # Filnavnet er vervet, ikke personen: «Regiformann» forblir regiformann.md
    # når en ny person overtar — bare Navn/E-post feltene endres.
    identifier_field: role
    slug: '{{role}}'
    summary: '{{role}} – {{name}}'
    thumbnail: image
    sortable_fields: [order, name]
    fields:
      - { label: Navn, name: name, widget: string }
      - { label: Rolle, name: role, widget: string }
      - { label: E-post, name: email, widget: string, hint: 'Allerede obfuskert (reversert) — skal ikke endres ved vervskifte' }
      - { label: Rekkefølge, name: order, widget: number, value_type: int, min: 1, default: 99 }
      - { label: Bilde (valgfritt), name: image, widget: image, required: false }

  - name: pakker
    label: Utleiepakker (lyd og lys)
    label_singular: Pakke
    folder: src/content/pakker
    extension: md
    create: true
    slug: '{{slug}}'
    summary: '{{type}} – {{title}}'
    thumbnail: image
    sortable_fields: [order, title]
    view_groups:
      - { label: Type, field: type }
    fields:
      - label: Type
        name: type
        widget: select
        options:
          - { label: Lyd, value: lyd }
          - { label: Lys, value: lys }
      - { label: Tittel, name: title, widget: string }
      - { label: Rekkefølge, name: order, widget: number, value_type: int, min: 1, default: 99 }
      - { label: Bilde (valgfritt), name: image, widget: image, required: false }
      - { label: Ledetekst for utstyrslisten (valgfritt), name: items_label, widget: string, required: false, default: 'I pakken:' }
      - label: Innholdspunkter
        name: items
        widget: list
        field: { label: Punkt, name: item, widget: string }
        required: false
        hint: 'Lenker kan skrives som [tekst](url) — pakkenes utstyrsliste. Teksten vises som avkryssingspunkter på siden.'
      # Sveltia: brødteksten må deklareres som «body»-felt (lagres under frontmatter).
      - { label: Beskrivelse, name: body, widget: markdown, required: false }

  # Sidetekster: src/data/sider-tekster/*.yaml — én fil per side. Hver oppføring
  # åpner feltene til nettopp den siden.
  - name: sidetekster
    label: Sidetekster – tittel og tekster per side
    files:
      - name: styret
        label: Styret-siden
        file: src/data/sider-tekster/styret.yaml
        fields:
          - label: Styret-siden
            name: styret
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }
              - { label: Introtekst (valgfritt), name: intro, widget: text, required: false, hint: 'Vises over styret-listen' }
      - name: generalforsamling
        label: Generalforsamling-siden
        file: src/data/sider-tekster/generalforsamling.yaml
        fields:
          - label: Generalforsamling-siden
            name: generalforsamling
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }
              - { label: Overskrift «Vedtekter», name: vedtekter_tittel, widget: string }
              - { label: Lenketekst «Vedtekter og lover», name: vedtekter_tekst, widget: string }
              - { label: Lenketekst «Innkalling», name: innkalling_tekst, widget: string, hint: 'Oppdater når ny innkalling legges ut' }
              - { label: Overskrift «Referater», name: referater_tittel, widget: string }
              - { label: Avsluttende notat, name: notat, widget: text }
      - name: kontakt
        label: Kontakt-siden
        file: src/data/sider-tekster/kontakt.yaml
        fields:
          - label: Kontakt-siden
            name: kontakt
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }
              - { label: Tittel «Generell kontakt», name: generell_tittel, widget: string }
              - { label: Tekst «Generell kontakt», name: generell_tekst, widget: string }
              - { label: Tittel «Utleie», name: utleie_tittel, widget: string }
              - { label: Tekst «Utleie», name: utleie_tekst, widget: string }
              - { label: Tittel «Styret»-listen, name: styret_tittel, widget: string }
      - name: lydpakker
        label: Lydpakker-siden
        file: src/data/sider-tekster/lydpakker.yaml
        fields:
          - label: Lydpakker-siden
            name: lydpakker
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }
      - name: lyspakker
        label: Lyspakker-siden
        file: src/data/sider-tekster/lyspakker.yaml
        fields:
          - label: Lyspakker-siden
            name: lyspakker
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }
      - name: ikke_funnet
        label: 404-siden
        file: src/data/sider-tekster/ikke_funnet.yaml
        fields:
          - label: 404-siden
            name: ikke_funnet
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Undertekst, name: teaser, widget: text }

  - name: nettsted
    label: Nettsideinnstillinger (forside, meny, tekstoverskrifter)
    files:
      - name: site
        label: Grunninfo – navn, slagord, Facebook
        file: src/data/site.yaml
        fields:
          - label: Nettsted
            name: site
            widget: object
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: Slagord, name: slogan, widget: string }
              - { label: Beskrivelse, name: description, widget: text }
              - { label: Facebook-brukernavn, name: facebook, widget: string, required: false }
              - { label: Bunntekst-tekst, name: footer_text, widget: text, required: false }
      - name: forside
        label: Forsiden
        file: src/data/forside.yaml
        fields:
          - label: Forsiden
            name: forside
            widget: object
            fields:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - { label: Overoverskrift, name: kicker, widget: string }
                  - { label: Tittel, name: title, widget: string }
                  - { label: Introtekst, name: intro, widget: text }
                  - label: Hovedknapp
                    name: cta_primary
                    widget: object
                    fields:
                      - { label: Tekst, name: label, widget: string }
                      - { label: Lenke, name: url, widget: string }
                  - label: Sekundærknapp
                    name: cta_secondary
                    widget: object
                    fields:
                      - { label: Tekst, name: label, widget: string }
                      - { label: Lenke, name: url, widget: string }
              - { label: Seksjonstittel, name: section_title, widget: string }
              - { label: Kortlenketekst (valgfritt), name: les_mer_tekst, widget: string, required: false, default: 'Les mer' }
              - label: Kort
                name: cards
                widget: list
                fields:
                  - { label: Tittel, name: title, widget: string }
                  - { label: Tekst, name: text, widget: text }
                  - { label: Lenke, name: url, widget: string }
                  - { label: Bilde, name: image, widget: image }
                  - { label: Alt-tekst, name: alt, widget: string }
      - name: meny
        label: Meny – lenkene i toppmenyen
        file: src/data/meny.yaml
        fields:
          - label: Meny
            name: meny
            widget: object
            fields:
              - label: Menypunkter
                name: items
                widget: list
                fields:
                  - { label: Tekst, name: label, widget: string }
                  - { label: Lenke, name: url, widget: string }
                  - label: Undermeny (valgfritt)
                    name: children
                    widget: list
                    required: false
                    fields:
                      - { label: Tekst, name: label, widget: string }
                      - { label: Lenke, name: url, widget: string }
