# Dependabot: automatiske sikkerhets- og versjonsoppdateringer.
# npm: ukentlig oppdatering av dependencies og sikkerhetsadvisories.
# GitHub Actions: hold workflows' actions oppdatert.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
