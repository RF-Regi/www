forside:
  hero:
    kicker: 'Studentforening ved UiO · Lyd, lys og scene'
    title: 'Velkommen til RF-Regi'
    intro: 'RF-Regi er en frivillig studentforening ved Universitetet i Oslo som driver med lyd, lys og scene. Vi leier ut utstyr og teknikere til studentforeninger og andre som måtte ha behov for det.'
    cta_primary:
      label: 'Se utleie'
      url: '/utleie/'
    cta_secondary:
      label: 'Bli frivillig'
      url: '/frivillig/'
  section_title: 'Hva kan vi hjelpe deg med?'
  cards:
    - title: 'Lydutleie'
      url: '/utleie/lydpakker/'
      image: '/images/lyd-eksempel.jpg'
      alt: 'Lydanlegg rigget på en scene'
      text: 'Vi har det meste av høyttalere, mikrofoner og mixere enten dere trenger utstyr til enkle oppsett som debatter, eller mer avanserte ting som revyer, konserter eller fester.'
    - title: 'Lysutleie'
      url: '/utleie/lyspakker/'
      image: '/images/lys-eksempel.jpg'
      alt: 'Lysrigg med movingheads på en scene'
      text: 'Vi har lyskontrollere, lyskastere, movingheads og strober. Trenger du lys til et arrangement har vi det du trenger.'
    - title: 'Riggere og teknikere'
      url: '/utleie/'
      image: '/images/geir-tek.jpg'
      alt: 'Tekniker som jobber ved mikserpulten'
      text: 'Trenger dere hjelp med rigging av utstyr eller avvikling av produksjonen så har vi mange flotte teknikere som gjerne tar på seg jobben med å hjelpe dere.'
    - title: 'Frivillig i RF-Regi'
      url: '/frivillig/'
      image: '/images/flex-i-garderobe.jpg'
      alt: 'Frivillig i garderoben under et arrangement'
      text: 'Ønsker å være med i en studentforening? Er du glad i lyd, lys og tekniske ting? Kanskje vi er studentforeningen du ser etter! Ønsker du mer informasjon om hvordan det er å være i RF-Regi og moderforeningen vår Realistforeningen, klikk her.'
